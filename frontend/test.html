<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Test Engine - StudentPro</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/test.css">
</head>
<body>

    <!-- EXAM ROOM HEADER -->
    <header class="test-header">
        <div class="test-title">
            <span class="test-badge">LIVE TEST</span>
            <h2 id="paperTitle">Practice Paper</h2>
        </div>
        <div style="display:flex; align-items:center; gap:16px;">
            <div class="timer-box" id="timerBox">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                <span>Time Left:</span>
                <strong id="timeDisplay">15:00</strong>
            </div>
            <a href="dashboard.html" class="exit-btn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                Exit Test
            </a>
        </div>
    </header>

    <!-- MAIN EXAM WORKSPACE -->
    <div class="test-container">
        <!-- QUESTION WORKSPACE -->
        <main class="question-workspace">
            <div>
                <div class="question-header">
                    <div class="question-header-left">
                        <span class="question-counter-pill" id="questionCounter">Question 1 of 5</span>
                        <span class="subject-badge-pill" id="subjectCategoryBadge">Subject Test</span>
                    </div>
                    <span class="question-marks">+1.0 / -0.25 Marks</span>
                </div>

                <div class="question-body">
                    <h3 id="questionText">Loading Question...</h3>
                    <div class="options-list" id="optionsContainer">
                        <!-- Rendered dynamically by test.js with letter circles A, B, C, D -->
                    </div>
                </div>
            </div>

            <!-- ACTION CONTROLS -->
            <div class="action-bar">
                <div class="action-bar-left">
                    <button id="prevBtn" class="btn btn-secondary" disabled>
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                        Previous
                    </button>
                    <button id="clearBtn" class="btn btn-tertiary">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.84"/></svg>
                        Clear
                    </button>
                </div>
                <button id="nextBtn" class="btn btn-primary">
                    Next Question
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                </button>
            </div>
        </main>

        <!-- QUESTION PALETTE & SUMMARY SIDEBAR -->
        <aside class="palette-sidebar">
            <div class="palette-card">
                <h3>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                    Question Palette
                </h3>
                <div class="palette-legend">
                    <span class="legend-item"><span class="badge answered"></span> Answered</span>
                    <span class="legend-item"><span class="badge current"></span> Active</span>
                    <span class="legend-item"><span class="badge unanswered"></span> Pending</span>
                </div>
                <div class="palette-grid" id="paletteGrid">
                    <!-- Palette numbers injected dynamically -->
                </div>
            </div>

            <div>
                <div class="palette-summary" style="margin-bottom: 14px;">
                    <span>Answered: <strong id="answeredCounter">0</strong></span>
                    <span>Remaining: <strong id="remainingCounter">0</strong></span>
                </div>
                <button id="submitTestBtn" class="btn btn-submit">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                    Submit Test Now
                </button>
            </div>
        </aside>
    </div>

    <!-- GLASS RESULT SCORECARD MODAL -->
    <div class="modal-overlay" id="resultModal" style="display: none;">
        <div class="result-card">
            <div class="result-badge-wrap pass" id="resultBadgeWrap">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>
            </div>
            <h2 class="result-heading" id="resultHeading">Test Completed!</h2>
            <p class="result-sub" id="resultSub">Here is your performance breakdown</p>

            <div class="score-stats-grid">
                <div class="score-stat-card">
                    <div class="val blue" id="modalScore">0/0</div>
                    <div class="lbl">Score</div>
                </div>
                <div class="score-stat-card">
                    <div class="val green" id="modalAccuracy">0%</div>
                    <div class="lbl">Accuracy</div>
                </div>
                <div class="score-stat-card">
                    <div class="val" id="modalTime">0s</div>
                    <div class="lbl">Time Taken</div>
                </div>
            </div>

            <div class="result-actions">
                <button class="btn btn-secondary" onclick="location.reload()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.84"/></svg>
                    Retake Test
                </button>
                <a href="dashboard.html" class="btn btn-primary" style="text-decoration: none;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                    Dashboard
                </a>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="js/questionBanks.js"></script>
    <script src="js/api.js"></script>
    <script src="js/test.js"></script>
</body>
</html>
