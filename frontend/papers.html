<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Papers - StudentPro</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/papers.css">
</head>
<body>

    <!-- GLOBAL NAVBAR -->
    <nav class="navbar">
        <div class="nav-brand">
            <div class="brand-icon">SP</div>
            <span>StudentPro</span>
        </div>
        <div class="nav-links">
            <a href="dashboard.html">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                Dashboard
            </a>
            <a href="mock-tests.html">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                Mock Tests
            </a>
            <a href="papers.html" class="active">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                Practice Papers
            </a>
            <a href="puzzles.html">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
                Mind Gym
            </a>
            <a href="sliding-puzzle.html">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="6" height="6"/><rect x="16" y="2" width="6" height="6"/><rect x="2" y="16" width="6" height="6"/><rect x="10" y="10" width="4" height="4"/></svg>
                Sliding Puzzle
            </a>
            <a href="progress.html">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                Progress
            </a>
        </div>
        <div class="nav-user">
            <div class="user-badge-pill">
                <div class="user-avatar-circle" id="userAvatarCircle">S</div>
                <span id="userEmailDisplay">student@gmail.com</span>
            </div>
            <button class="logout-btn" id="logoutBtn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                Logout
            </button>
        </div>
    </nav>

    <main class="dashboard-container">
        <section class="dashboard">

            <!-- TITLE BANNER -->
            <div class="welcome-banner" style="margin-bottom:28px;">
                <div>
                    <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">
                        <div style="width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                        </div>
                        <span style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,0.75);">Technology Papers</span>
                    </div>
                    <h1 style="font-size:26px;color:#fff;margin-bottom:4px;">Fullstack Practice Papers</h1>
                    <p style="color:rgba(255,255,255,0.8);">Select any Frontend or Backend technology to launch an interactive timed test.</p>
                </div>
                <a href="mock-tests.html" class="primary-btn" style="display:flex;align-items:center;gap:8px;">
                    Go to Mock Tests
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                </a>
            </div>

            <!-- SEARCH BAR -->
            <div class="search-box">
                <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" id="searchInput" placeholder="Search papers by technology name...">
            </div>

            <!-- FILTERS -->
            <div class="filter-bar">
                <button class="filter-btn active" data-subject="all">All Papers</button>
                <button class="filter-btn" data-subject="html">HTML5</button>
                <button class="filter-btn" data-subject="css">CSS3</button>
                <button class="filter-btn" data-subject="javascript">JavaScript</button>
                <button class="filter-btn" data-subject="react">React JS</button>
                <button class="filter-btn" data-subject="node">Node.js</button>
                <button class="filter-btn" data-subject="express">Express.js</button>
                <button class="filter-btn" data-subject="mongodb">MongoDB</button>
                <button class="filter-btn" data-subject="python">Python</button>
            </div>

            <!-- PAPERS GRID -->
            <div class="papers-grid" id="papersGrid"></div>
            <div id="noResults" class="no-results" style="display:none;">No matching papers found.</div>

        </section>
    </main>

    <script src="js/questionBanks.js"></script>
    <script src="js/api.js"></script>
    <script src="js/papers.js"></script>
</body>
</html>
